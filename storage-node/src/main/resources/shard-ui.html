<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DistriSys Shard Console</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111820; color: #eaf2f4; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 2rem, 42rem); margin: clamp(2rem, 9vw, 7rem) auto; }
    h1 { font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -.06em; margin: 0; }
    p { color: #a9bbc6; line-height: 1.6; }
    form { padding: clamp(1rem, 4vw, 2rem); margin-top: 2rem; background: #19232e; border: 1px solid #394a5a; border-radius: 1rem; }
    .fields { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: .75rem; }
    label { display: grid; gap: .5rem; font-size: .9rem; font-weight: 600; }
    input, button { font: inherit; }
    input { background: #111820; color: inherit; border: 1px solid #536677; padding: .65rem; border-radius: .45rem; min-width: 0; width: 100%; }
    .file { margin-top: 1.3rem; }
    .actions { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: 1.3rem; }
    button { cursor: pointer; padding: .65rem 1rem; border-radius: .5rem; border: 1px solid #7ce8c5; background: #7ce8c5; color: #10231e; font-weight: 700; }
    button + button { color: #b6f5e1; background: transparent; }
    button:disabled { opacity: .55; cursor: wait; }
    output { display: block; margin-top: 1rem; overflow-wrap: anywhere; }
    output[data-error] { color: #ffb5a9; }
    @media (max-width: 420px) { .fields { grid-template-columns: 1fr 1fr; } .fields label:first-child { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <main>
    <h1>DistriSys</h1>
    <p>Upload or download a shard on your local storage node.</p>
    <form id="transfer">
      <div class="fields">
        <label>Version ID
          <input name="version" required pattern="[A-Za-z0-9\-]{1,128}" maxlength="128" value="demo-v1">
        </label>
        <label>Stripe index
          <input name="stripe" required type="number" min="0" max="2147483647" value="0">
        </label>
        <label>Shard index
          <input name="shard" required type="number" min="0" max="255" value="0">
        </label>
      </div>
      <label class="file">File to upload
        <input name="file" type="file">
      </label>
      <div class="actions">
        <button type="submit" value="PUT">Upload shard</button>
        <button type="submit" value="GET">Download shard</button>
      </div>
      <output id="status" aria-live="polite"></output>
    </form>
  </main>
  <script>
    const form = document.querySelector('#transfer');
    const status = document.querySelector('#status');
    const buttons = form.querySelectorAll('button');

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const method = event.submitter?.value ?? 'PUT';
      const fields = form.elements;
      const parts = [fields.version.value, fields.stripe.valueAsNumber, fields.shard.valueAsNumber];
      const file = fields.file.files[0];
      status.removeAttribute('data-error');
      if (method === 'PUT' && (!file || file.size > 64 * 1024 * 1024)) {
        status.setAttribute('data-error', '');
        status.textContent = 'Choose a file up to 64 MiB to upload.';
        return;
      }

      buttons.forEach(button => button.disabled = true);
      status.textContent = method === 'PUT' ? 'Uploading…' : 'Downloading…';
      try {
        const options = { method, headers: { 'X-Shard-UI': '1' } };
        if (method === 'PUT') options.body = file;
        const response = await fetch('/shards/' + parts.map(encodeURIComponent).join('/'), options);
        if (!response.ok) throw new Error(await response.text());
        if (method === 'PUT') {
          status.textContent = await response.text();
        } else {
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = parts.join('_') + '.shard';
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          status.textContent = 'Downloaded ' + blob.size + ' bytes.';
        }
      } catch (error) {
        status.setAttribute('data-error', '');
        status.textContent = error.message;
      } finally {
        buttons.forEach(button => button.disabled = false);
      }
    });
  </script>
</body>
</html>
